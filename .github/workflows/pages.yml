name: Publish Twesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The interface tests talk to the browser with Node's built-in WebSocket (Node 22 or newer).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check application rules
        run: npm test
      - name: Check the interface in a real browser
        run: npm run test:ui
      - name: Keep screenshots of failed interface checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-failures
          path: tests/ui/artifacts/
          if-no-files-found: ignore
      - name: Build website and offline copy
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
