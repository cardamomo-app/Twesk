name: Publish Twesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The interface tests talk to the browser with Node's built-in WebSocket (Node 22 or newer).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check application rules
        run: npm test
      - name: Check the interface in a real browser
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee ui-tests.log
      # Raw logs need admin access; annotations are visible on the public run page.
      - name: Summarize failed interface checks
        if: failure()
        run: |
          grep -E '^✖|Error|Assertion|expected|actual|Timed out' ui-tests.log | grep -v '^ℹ' | head -40 | while IFS= read -r line; do echo "::error title=Interface check::$line"; done
      - name: Keep screenshots of failed interface checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-failures
          path: tests/ui/artifacts/
          if-no-files-found: ignore
      - name: Build website and offline copy
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
