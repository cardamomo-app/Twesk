/* Celebration pass */
@keyframes coin-arc{0%{opacity:0;transform:translate(0,0) scale(.6) rotate(0)}12%{opacity:1;transform:translate(calc(var(--dx)*.08),calc(var(--arc) * .6)) scale(1.15) rotate(40deg)}45%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.25 + var(--arc))) scale(1.1) rotate(140deg)}88%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.7) rotate(300deg)}}

"achievements.js":function(require,exports){
const stats=['body','mind','soul','heart'];
const ACHIEVEMENT_GROUPS=[['all','All seals'],['journey','Journey'],['tasks','Tasks'],['body','Body'],['mind','Mind'],['soul','Soul'],['heart','Heart'],['monsters','Monsters'],['vault','Vault'],['journal','Journal']];
const milestones=(group,metric,thresholds,titles,verb)=>thresholds.map((target,i)=>({id:`${group}-${target}`,group,metric,target,title:titles[i],description:verb(target),tier:Math.min(4,i+1)}));
const ACHIEVEMENTS=[
  {id:'first-level',group:'journey',metric:'highestLevel',target:2,title:'The Awakening',description:'Reach level 2 in any stat',tier:1},
  {id:'fourfold',group:'journey',metric:'lowestLevel',target:2,title:'Fourfold Adventurer',description:'Reach level 2 in all four stats',tier:3},
  ...milestones('tasks','tasks',[1,10,50,100],['First Contract','Errand Runner','Guild Regular','Quest Keeper'],n=>`Complete ${n} ${n===1?'task':'tasks'}`),
  ...milestones('body','body',[10,50,100],['Trail Walker','Iron Roots','Titan’s Stride'],n=>`Complete ${n} Body habits`),
  ...milestones('mind','mind',[10,50,100],['Curious Apprentice','Lore Keeper','Archmage of Ideas'],n=>`Complete ${n} Mind habits`),
  ...milestones('soul','soul',[10,50,100],['Stillwater Initiate','Inner Compass','Keeper of the Flame'],n=>`Complete ${n} Soul habits`),
  ...milestones('heart','heart',[10,50,100],['Kindred Spirit','Hearth Keeper','Heart of the Realm'],n=>`Complete ${n} Heart habits`),
  ...milestones('monsters','monsters',[1,3,8,25],['Mossbreaker','Monster Scout','Chapter Champion','Realm Guardian'],n=>`Defeat ${n} ${n===1?'monster':'monsters'}`),
  ...milestones('vault','notes',[1,10,50],['Pocket Scribe','Idea Alchemist','Vault Curator'],n=>`Save ${n} ${n===1?'entry':'entries'} to the Vault`),
  ...milestones('journal','journals',[1,10,30],['First Page','Mirror Mage','Chronicler'],n=>`Write ${n} journal ${n===1?'entry':'entries'}`),
];
function createProgress(){return {tasks:0,habits:Object.fromEntries(stats.map(c=>[c,0])),notes:0,journals:0,earned:{}};}
function ensureProgress(s){
  if(s.progress===undefined){
    const p=createProgress();p.tasks=s.tasks.filter(t=>t.done).length;
    for(const c of stats)p.habits[c]=s.habits.filter(h=>h.category===c).reduce((sum,h)=>sum+h.logs.length,0);
    p.notes=s.notes.length;p.journals=s.notes.filter(n=>n.kind==='journal').length;s.progress=p;
  }
  return s.progress;
}
const defeatedCount=s=>s.monster.number-1+(s.monster.defeatedOn?1:0);
function achievementValue(s,badge){
  const p=ensureProgress(s);
  if(badge.metric==='highestLevel')return Math.max(...stats.map(c=>Math.floor(s.xp[c]/300)+1));
  if(badge.metric==='lowestLevel')return Math.min(...stats.map(c=>Math.floor(s.xp[c]/300)+1));
  if(badge.metric==='monsters')return defeatedCount(s);
  return stats.includes(badge.metric)?p.habits[badge.metric]:p[badge.metric];
}
function awardAchievements(s,day){
  const p=ensureProgress(s),earned=[];
  for(const badge of ACHIEVEMENTS)if(!p.earned[badge.id]&&achievementValue(s,badge)>=badge.target){p.earned[badge.id]=day;earned.push(badge);}
  return earned;
}
function monsterStatus(s,n){
  if(n<s.monster.number||(n===s.monster.number&&s.monster.defeatedOn))return 'defeated';
  if(n===s.monster.number)return 'available';
  if(n===s.monster.number+1)return 'next';
  return 'locked';
}

Object.assign(exports,{ACHIEVEMENT_GROUPS,ACHIEVEMENTS,createProgress,ensureProgress,defeatedCount,achievementValue,awardAchievements,monsterStatus});
},

"cuboid-renderer.js":function(require,exports){
// Axis-aligned binary space partitioning. Splitting faces at world-space planes
// gives a correct painter order even when solids overlap or span one another.
const EPS=1e-8;
const CAMERA_RISE=.70/1.65;
function projectPoint([x,y,z],angle){
  return [120+(x*Math.cos(angle)-y*Math.sin(angle))*1.65,215+(x*Math.sin(angle)+y*Math.cos(angle))*.70-z*1.65];

function bounds(points){return [0,1,2].map(axis=>[Math.min(...points.map(p=>p[axis])),Math.max(...points.map(p=>p[axis]))]);}
function fragment(face,points){return {...face,points,bounds:bounds(points)};}
function split(face,axis,value){
  const negative=[],positive=[],points=face.points;
  for(let i=0;i<points.length;i++){
    const a=points[i],b=points[(i+1)%points.length],da=a[axis]-value,db=b[axis]-value;
    if(da<=EPS)negative.push(a);if(da>=-EPS)positive.push(a);
    if((da<-EPS&&db>EPS)||(da>EPS&&db<-EPS)){
      const t=da/(da-db),p=a.map((v,j)=>v+(b[j]-v)*t);p[axis]=value;
      negative.push(p);positive.push(p);
    }
  }
  return [fragment(face,negative),fragment(face,positive)];
}
function build(faces){
  if(!faces.length)return null;
  const planes=[...new Map(faces.map(f=>[`${f.axis}:${f.value}`,[f.axis,f.value]])).values()];
  let best=null,score=Infinity;
  // A bounded set of candidates keeps scene construction cheap. The resulting
  // tree is cached; rotating only traverses it and projects the visible faces.
  const stride=Math.max(1,Math.floor(planes.length/40));
  for(let i=0;i<planes.length;i+=stride){
    const [axis,value]=planes[i];let negative=0,positive=0,cuts=0;
    for(const face of faces){const [lo,hi]=face.bounds[axis];if(lo<value-EPS)negative++;if(hi>value+EPS)positive++;if(lo<value-EPS&&hi>value+EPS)cuts++;}
    const cost=Math.max(negative,positive)+cuts*1.5;
    if(cost<score){best=[axis,value];score=cost;}
  }
  const [axis,value]=best,negative=[],positive=[],coplanar=[];
  for(const face of faces){
    const [lo,hi]=face.bounds[axis];
    if(lo>=value-EPS&&hi<=value+EPS)coplanar.push(face);
    else if(hi<=value+EPS)negative.push(face);
    else if(lo>=value-EPS)positive.push(face);
    else {const [a,b]=split(face,axis,value);negative.push(a);positive.push(b);}

  coplanar.sort((a,b)=>a.order-b.order);

function createCuboidScene(boxes){
  const faces=[];
  boxes.forEach((box,order)=>{

    const add=(axis,value,sign,points,light)=>faces.push({axis,value,normal:[0,1,2].map(a=>a===axis?sign:0),points,bounds:bounds(points),color,light,part,order});
    add(2,Z,1,[[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]],1.14);
    add(2,z,-1,[[x,y,z],[x,Y,z],[X,Y,z],[X,y,z]],.65);
    add(0,x,-1,[[x,y,z],[x,Y,z],[x,Y,Z],[x,y,Z]],.78);
    add(0,X,1,[[X,y,z],[X,y,Z],[X,Y,Z],[X,Y,z]],.93);
    add(1,y,-1,[[x,y,z],[x,y,Z],[X,y,Z],[X,y,z]],.84);
    add(1,Y,1,[[x,Y,z],[X,Y,z],[X,Y,Z],[x,Y,Z]],1);
  });

}
function visibleCuboidFaces(scene,angle){
  const direction=[Math.sin(angle),Math.cos(angle),CAMERA_RISE],result=[];
  const walk=node=>{
    if(!node)return;
    const positive=direction[node.axis]>=0;
    walk(positive?node.negative:node.positive);

  };
  walk(scene);return result;
}

    tonic: null,
    activePet: null,
  };

      next: `${then.max} maximum HP`,
    },
    mind: {
      description:
        'Exploit monster weaknesses. Extra damage applies to every attack and adds to your weapon and spell.',
      now: `+${now.attack} damage per attack`,
      next: `+${then.attack} damage per attack`,
    },
    soul: {
      description: 'A chance to deflect each incoming monster attack completely and take no damage.',
      now: `${percent(now.dodge)} deflect chance`,
      next: `${percent(then.dodge)} deflect chance`,
    },
    heart: {
      description:
        'Rally once per fight when you survive a hit at half health or below. Recovery is capped by missing HP.',
      now: now.rally ? `Recover up to ${now.rally} HP` : 'No combat rally yet',
      next: `Recover up to ${then.rally} HP`,
      healing: `Also improves potions and recovery journaling: +${percent(E.healingMultiplier(intrinsic) - 1)} now → +${percent(E.healingMultiplier(stronger) - 1)} next level.`,
    },
  };

  return `<div class="stat-tip-heading">${icon(category)}<strong>${E.CATEGORY_META[category].label}</strong></div><p>${d.description}</p><div class="stat-tip-benefit"><span>Level ${current}<small>Current</small></span><strong>${d.now}</strong></div><div class="stat-tip-benefit next"><span>Level ${next}<small>Next</small></span><strong>${d.next}</strong></div>${d.healing ? `<p class="stat-tip-healing">${d.healing}</p>` : ''}<small class="stat-tip-xp">${app.state.xp[category] % 300} / 300 XP toward level ${next}</small>`;

);

"ui-modal.js":function(require,exports){
// Opening and closing dialogs, saving changes as transactions, and seal notifications.

      newBadges = awardAchievements(app.state, today());
    view.render();
    persist();
    if (deferBadges) app.pendingBadges.push(...newBadges);

    app.state = previous;

  }

    const target = $('#overlay [autofocus]') || $('#overlay button');

  });

  if (app.busy) {
    view.finishBattlePlayback();
    return;

  app.avatarPreview = null;
  if (today() !== app.lastDay) {
    E.rollover(app.state, today());
    view.render();
    persist();
  } else view.renderModal();
  lastFocused?.focus?.();
}

  if (!badges.length) return;
  const badge = badges[0],
    el = document.createElement('button');
  el.className = 'badge-unlock';
  el.innerHTML = `<span class="seal-wrap"><span class="seal-rays" aria-hidden="true"></span>${badgeArt(badge, true)}</span><span><small>SEAL EARNED${badges.length > 1 ? ' · +' + (badges.length - 1) + ' more' : ''}</small><strong>${esc(badge.title)}</strong><span>View achievements ↗</span></span>`;
  el.setAttribute('aria-label', `Seal earned: ${badge.title}. Open achievements`);
  el.onclick = () => {
    if (app.busy) return;

    app.sealFilter = badges.length > 1 ? 'all' : badge.group;

    );
  },
};

function celebrateToggle(r, sourceRect, id, day) {
  if (!r) return;
  if (r < 0) return toast('Task restored and reward reversed.');
  rewardEffect(sourceRect, r);
  const task = app.state.tasks.find(t => t.id === id);
  toast(`Task cleared. +${r} gold.${task?.repeat ? ` Back ${dueLabel(task.due)}.` : ''}`, () =>

  );

  'delete-task'(b, { id }) {
    commit(() => {
      app.state.tasks = app.state.tasks.filter(t => t.id !== id);

const forms = {

          repeat: data.get('repeat') || null,
          sort: !!data.get('sort'),
        },
        today(),
      ),
    );
    if (r) closeModal();
  },
};

Object.assign(exports,{renderProjects,renderTasks,modals,actions,forms});
},
"ui-habits.js":function(require,exports){

const actions = {

};

"notes-export.js":function(require,exports){
// Merge Vault notes into one readable plain-text document.
// Notes are ordered oldest first. Each note gets its date as a heading; its own paragraphs are kept,
// and a "* * *" divider with blank lines separates one note from the next.
const NOTE_DIVIDER = '* * *';

const dateLabel = (iso, timeZone) =>
  new Intl.DateTimeFormat('en', {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    timeZone,
  }).format(new Date(iso));
// Normalize line endings and trailing spaces, and keep at most one blank line between paragraphs.
function tidyText(text) {
  return String(text)
    .replace(/\r\n?/g, '\n')
    .split('\n')
    .map(line => line.replace(/[ \t]+$/, ''))
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
const isJournalExport = notes => notes.length > 0 && notes.every(n => n.kind === 'journal');
function notesToText(notes, { timeZone = 'UTC', exportedAt = new Date().toISOString() } = {}) {
  const ordered = [...notes].sort((a, b) => a.created.localeCompare(b.created));
  // A journal-only export reads as a journal; a mixed one labels its journal entries.
  const journal = isJournalExport(ordered);
  const noun = journal
    ? ordered.length === 1
      ? 'entry'
      : 'entries'
    : ordered.length === 1
      ? 'note'
      : 'notes';
  const header = `Twesk ${journal ? 'journal' : 'notes'} · ${ordered.length} ${noun} · exported ${dateLabel(exportedAt, timeZone)}`;
  const sections = ordered.map(note => {
    const kind = note.kind === 'journal' && !journal ? ' · Journal' : '';
    return `${dateLabel(note.created, timeZone)}${kind}\n\n${tidyText(note.text)}`;
  });
  return `${header}\n\n\n${sections.join(`\n\n\n${NOTE_DIVIDER}\n\n\n`)}\n`;
}

Object.assign(exports,{NOTE_DIVIDER,tidyText,isJournalExport,notesToText});
},

  );

  const base = comparisonBase(),

    <div class="shop-tabs" role="tablist" aria-label="Item categories">${shopTabs.map(([key, label, symbol]) => `<button role="tab" id="shop-tab-${key}" aria-controls="shop-items" aria-selected="${app.shopCategory === key}" tabindex="${app.shopCategory === key ? '0' : '-1'}" data-action="shop-tab" data-category="${key}">${icon(symbol)}${label}</button>`).join('')}</div>
    <div id="shop-items" role="tabpanel" aria-labelledby="shop-tab-${app.shopCategory}" tabindex="0"><div class="shop-grid">${
      app.shopCategory === 'style'

                  owned = !consumable && count > 0;
                const selected = inUse(i);

"ui-odds.js":function(require,exports){

"combat-presentation.js":function(require,exports){
// Presentation only. These descriptions never roll dice or modify rewards.
function describeCombatEvent(event, { monster = 'Monster', weapon, armor, spell, pet } = {}) {
  const damage = event.actualDamage ?? event.amount;
  const badges = [];
  if (event.type === 'attack') {
    if (event.weaponBonus) badges.push({label:`+${event.weaponBonus} ${weapon?.name || 'weapon'}`,tone:'gear'});
    if (event.mindBonus) badges.push({label:`+${event.mindBonus} Mind · weakness exploited`,tone:'mind'});
    if (event.spellBonus) badges.push({label:`+${event.spellBonus} ${spell?.name || 'Ember spell'}`,tone:'soul'});
    if (event.petBonus) badges.push({label:`+${event.petBonus} ${pet?.name || 'companion'}`,tone:'gear'});
    return {title:weapon?'Sword strike':'You attack',detail:`${event.amount} attack damage${event.enemy===0?' · finishing blow':''}`,float:`−${damage} HP`,target:'monster',tone:'attack',badges,duration:1650};
  }
  if (event.type === 'hit') {
    const armorBlock=event.blocked-(event.spellBlock||0)-(event.petBlock||0);
    if (armorBlock) badges.push({label:`Blocked ${armorBlock} · ${armor?.name || 'armor'}`,tone:'gear'});
    if (event.spellBlock) badges.push({label:`Blocked ${event.spellBlock} · ${spell?.name || 'Stone ward'}`,tone:'soul'});
    if (event.petBlock) badges.push({label:`Blocked ${event.petBlock} · ${pet?.name || 'companion'}`,tone:'gear'});
    return {title:event.blocked?'Attack partially blocked':`${monster} attacks`,detail:event.rawDamage!=null?`${event.rawDamage} incoming − ${event.blocked || 0} blocked = ${event.amount} damage`:`${event.amount} damage`,float:`−${damage} HP`,target:'player',tone:'hit',badges,duration:event.blocked?1850:1650};
  }
  if (event.type === 'deflect') {
    // At Soul 1 the deflect came from a tonic or companion, not from Soul itself.
    badges.push({label:event.soulLevel>1?`Soul Lv. ${event.soulLevel} · attack deflected`:event.soulLevel===1?'Quick feet · attack deflected':'Soul · attack deflected',tone:'soul'});
    return {title:'Deflected!',detail:`${monster} misses. You take no damage.`,float:'DEFLECTED',target:'player',tone:'deflect',badges,duration:1850};
  }
  if (event.type === 'rally') {
    badges.push({label:event.heartLevel>1?`Heart Lv. ${event.heartLevel} · once per encounter`:'Rally · once per encounter',tone:'heart'});
    return {title:'Heart rally',detail:'You recover after a heavy hit.',float:`+${event.amount} HP`,target:'player',tone:'rally',badges,duration:1900};
  }
  return {title:'Ready',detail:'',float:'',target:null,tone:'ready',badges,duration:1000};
}

Object.assign(exports,{describeCombatEvent});
},

"ui-settings.js":function(require,exports){
// Settings, backups, and full reset/restore.
const E=require("engine.js");

}=require("ui-core.js");
const { closeModal, commit, openModal }=require("ui-modal.js");
function backupStatus() {
  const last = app.state.settings.lastBackup;

}
function backupReminder() {
  const message = app.state.settings.lastBackup
    ? `It’s been ${E.daysBetween(app.state.settings.lastBackup, today())} days since your last backup.`

function resetSettings() {

  } catch {}

}
function exportBackup() {
  if (!app.protectSave) {
    app.state.settings.lastBackup = today();
    persist();
    view.render();
    const status = $('#backup-status');
    if (status) status.textContent = backupStatus();
  }
  const blob = new Blob([app.protectSave && app.rawSave ? app.rawSave : JSON.stringify(app.state, null, 2)], {
      type: 'application/json',
    }),
    url = URL.createObjectURL(blob),
    link = document.createElement('a');

    Object.assign(app, viewDefaults(), {

      rawSave: JSON.stringify(next),

};
const modals = {
  settings() {
    return modalShell(
      'Make yourself at home',
      `<form id="settings-form" class="form-body"><label>Your adventurer’s name<input name="name" required maxlength="40" value="${esc(app.state.name)}"></label><label>Your timezone<input name="timezone" list="timezones" required value="${esc(app.state.settings.timezone)}"><datalist id="timezones">${[...new Set([E.deviceTimezone(), 'Atlantic/Madeira', 'Europe/London', 'Europe/Lisbon', 'Europe/Berlin', 'America/New_York', 'America/Los_Angeles', 'Asia/Tokyo', 'Australia/Sydney', 'UTC'])].map(z => `<option value="${z}">`).join('')}</datalist></label><p class="form-help">Habits become available again at midnight here. No schedules and no damage for missed days.${app.state.settings.timezone !== E.deviceTimezone() ? ` <button type="button" class="text-button" data-action="use-device-timezone">Use this device’s timezone (${esc(E.deviceTimezone())})</button>` : ''}</p><label class="checkbox-label"><input type="checkbox" name="muted" ${app.state.settings.muted ? 'checked' : ''}>Mute little reward sounds</label><label class="checkbox-label"><input type="checkbox" name="reduced" ${app.state.settings.reducedMotion ? 'checked' : ''}>Reduce motion</label><div class="backup-box"><h3>Your progress stays on this device</h3><p>Back it up before clearing browser data or moving to another browser. There are no accounts or syncing yet.</p><p class="backup-status" id="backup-status">${backupStatus()}</p><div class="backup-actions"><button type="button" class="button secondary" data-action="export">${icon('download')}Export backup</button><button type="button" class="button secondary" data-action="import">${icon('upload')}Import backup</button></div><input type="file" id="import-file" accept="application/json,.json" hidden></div>${resetSettings()}${app.protectSave ? '<p class="save-warning">The old save is protected. Saving these settings will begin a new save and replace it.</p>' : ''}<div class="form-actions"><span class="small-label">TWESK · MVP 0.1</span><button class="button primary">Save settings</button></div></form>`,
    );
  },
  'confirm-import'() {

      'Restore this backup?',

    );
  },

const actions = {
  theme(b, { a, id, sourceRect }) {
    commit(() => {
      app.state.settings.theme = app.state.settings.theme === 'light' ? 'dark' : 'light';
    });
  },
  mute(b, { a, id, sourceRect }) {

    });
  },
  settings(b, { a, id, sourceRect }) {
    openModal({ type: 'settings' });
  },
  'reset-progress'(b, { a, id, sourceRect }) {
    openModal({ type: 'confirm-reset' });
  },
  'restore-previous'(b, { a, id, sourceRect }) {
    openModal({ type: 'confirm-previous' });
  },
  'confirm-reset': resetOrRestore,
  'confirm-previous': resetOrRestore,
  export(b, { a, id, sourceRect }) {
    exportBackup();
  },
  'backup-later'(b, { a, id, sourceRect }) {
    commit(() => {
      app.state.settings.backupNudge = today();
    });
    toast('I’ll remind you again next week.');
  },
  'use-device-timezone'(b, { a, id, sourceRect }) {
    const input = $('#settings-form [name="timezone"]');
    input.value = E.deviceTimezone();
    input.focus();
    b.remove();
  },
  import(b, { a, id, sourceRect }) {
    $('#import-file').click();
  },
  'confirm-import'(b, { a, id, sourceRect }) {
    app.state = app.pendingImport;
    app.pendingImport = null;
    app.protectSave = false;
    app.startupWarning = '';
    persist();
    app.modal = null;
    app.chanceKey = '';
    view.render();
    toast('Backup restored. Welcome back.');
  },
};
const forms = {
  'settings-form'(data) {
    const name = data.get('name').trim(),
      timezone = data.get('timezone').trim();
    if (!name) return;
    try {
      E.dateKey(new Date(), timezone);
    } catch {
      toast('Use a timezone such as Atlantic/Madeira or America/New_York.');
      return;
    }
    app.protectSave = false;
    app.startupWarning = '';
    commit(() => {
      app.state.name = name;
      app.state.settings.timezone = timezone;
      app.state.settings.muted = !!data.get('muted');
      app.state.settings.reducedMotion = !!data.get('reduced');
    });
    closeModal();
    toast('Made a little more yours.');
  },
};
async function onChange(event) {
  if (event.target.id === 'import-file') {
    const file = event.target.files[0];
    if (!file) return;
    try {
      if (file.size > 5e6) throw new Error('Choose a backup smaller than 5 MB.');
      app.pendingImport = E.validateState(JSON.parse(await file.text()));
      openModal({ type: 'confirm-import' });
    } catch (error) {
      toast(
        error.message === 'Unexpected end of JSON input' ? 'This backup could not be read.' : error.message,
      );
    }
  }
}

Object.assign(exports,{backupReminder,modals,actions,forms,onChange});
},
"save-recovery.js":function(require,exports){
const {freshState,validateState}=require("engine.js");

const SAVE_KEY='twesk.v1';
const PREVIOUS_SAVE_KEY='twesk.v1.previous';
function replaceSave(storage,currentRaw,next){
  const previous=storage.getItem(PREVIOUS_SAVE_KEY);
  storage.setItem(PREVIOUS_SAVE_KEY,currentRaw);
  try{storage.setItem(SAVE_KEY,JSON.stringify(next));}
  catch(error){
    try{if(previous===null)storage.removeItem(PREVIOUS_SAVE_KEY);else storage.setItem(PREVIOUS_SAVE_KEY,previous);}catch{}
    throw error;
  }
  return next;
}
function resetProgress(storage,current,originalRaw=null){
  const next=freshState();next.revision=(current.revision||0)+1;
  return replaceSave(storage,originalRaw??JSON.stringify(current),next);
}
function restorePreviousProgress(storage,current){
  const raw=storage.getItem(PREVIOUS_SAVE_KEY);
  if(!raw)throw new Error('There is no previous save to restore.');
  const next=validateState(JSON.parse(raw));
  next.revision=Math.max(current.revision||0,next.revision||0)+1;
  return replaceSave(storage,JSON.stringify(current),next);
}

Object.assign(exports,{SAVE_KEY,PREVIOUS_SAVE_KEY,resetProgress,restorePreviousProgress});
},
"ui-history.js":function(require,exports){
// Progress history: a month calendar of habits, tasks, and stat growth, with day details.
const E=require("engine.js");
const { monsterName }=require("art.js");
const { $, app, coin, esc, icon, modalShell, today, view }=require("ui-core.js");
const { openModal }=require("ui-modal.js");

const shift = (day, n) => {
  const d = new Date(`${day}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const monthOf = day => day.slice(0, 7);
const addMonths = (month, n) => {
  const d = new Date(`${month}-01T12:00:00Z`);
  d.setUTCMonth(d.getUTCMonth() + n);
  return d.toISOString().slice(0, 7);
};
const format = (day, options) =>
  new Intl.DateTimeFormat('en', { ...options, timeZone: 'UTC' }).format(new Date(`${day}T12:00:00Z`));
const noteDay = note => E.dateKey(new Date(note.created), app.state.settings.timezone);

const activity = d => d.habits.length + d.tasks;
const heat = n => (n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 8 ? 3 : 4);

// The earliest month with any dated record, so navigation stops where history begins.
function firstMonth() {
  const days = [
    ...app.state.habits.flatMap(h => [...h.logs, ...h.harmLogs].map(l => l.day)),
    ...Object.keys(app.state.history || {}),
    ...app.state.notes.map(noteDay),
    ...app.state.battles.map(b => b.day),
  ].sort();
  return monthOf(days[0] || today());
}
function monthDays(month) {
  const days = [];
  for (let day = `${month}-01`; monthOf(day) === month; day = shift(day, 1)) days.push(day);
  return days;
}
function dayCell(d, selected, current) {
  const level = heat(activity(d)),
    future = d.day > current;
  const markers = [
    d.tasks ? `<i class="mark task" title="${d.tasks} tasks"></i>` : '',
    d.levels.length ? `<i class="mark level" title="Level up"></i>` : '',
    d.battles.some(b => b.won) ? `<i class="mark win" title="Victory"></i>` : '',
  ].join('');
  const label = `${format(d.day, { weekday: 'long', month: 'long', day: 'numeric' })}: ${d.habits.length} habits, ${d.tasks} tasks${d.levels.length ? ', level up' : ''}${d.battles.some(b => b.won) ? ', victory' : ''}`;
  return `<button class="history-day heat-${level} ${selected ? 'selected' : ''} ${d.day === current ? 'today' : ''}" data-action="history-day" data-day="${d.day}" aria-pressed="${selected}" aria-label="${esc(label)}" ${future ? 'disabled' : ''} tabindex="${selected ? 0 : -1}"><span>${Number(d.day.slice(8))}</span><span class="marks">${markers}</span></button>`;
}
function dayDetails(d) {
  const xpTotal = E.CATEGORIES.reduce((n, c) => n + d.xp[c], 0);
  const empty =
    !d.habits.length && !d.tasks && !d.harm.length && !d.notes && !d.journals && !d.battles.length;
  const heading = `<h3>${format(d.day, { weekday: 'long', month: 'long', day: 'numeric' })}</h3>`;
  if (empty)
    return `<section class="history-details">${heading}<p class="history-empty">${d.day === today() ? 'Nothing logged yet today. There’s still time.' : 'A quiet day. Rest counts too.'}</p></section>`;
  const facts = [
    d.habits.length
      ? `${icon('leaf')}<strong>${d.habits.length}</strong> ${d.habits.length === 1 ? 'habit' : 'habits'}`
      : '',
    d.tasks
      ? `${icon('check')}<strong>${d.tasks}</strong> ${d.tasks === 1 ? 'task' : 'tasks'} ${coin(d.gold)}`
      : '',
    xpTotal ? `${icon('soul')}<strong>+${xpTotal}</strong> XP` : '',
  ]
    .filter(Boolean)
    .map(f => `<span>${f}</span>`)
    .join('');
  const xpChips = E.CATEGORIES.filter(c => d.xp[c])
    .map(c => `<span class="history-chip ${c}">${icon(c)}${E.CATEGORY_META[c].label} +${d.xp[c]}</span>`)
    .join('');
  const levels = d.levels
    .map(c => `<li class="history-level ${c}">${icon(c)}${E.CATEGORY_META[c].label} reached a new level</li>`)
    .join('');
  const habits = d.habits
    .map(
      h =>
        `<li><span class="history-dot ${h.category}"></span>${esc(h.title)}<small>+${h.xp} XP</small></li>`,
    )
    .join('');
  const harm = d.harm
    .map(
      h => `<li><span class="history-dot harm"></span>${esc(h.title)}<small>${h.count}× logged</small></li>`,
    )
    .join('');
  const extras = [
    d.notes ? `${d.notes} ${d.notes === 1 ? 'note' : 'notes'} captured` : '',
    d.journals ? `${d.journals} journal ${d.journals === 1 ? 'entry' : 'entries'}` : '',
    ...d.battles.map(b => `${b.won ? 'Defeated' : 'Fell to'} ${monsterName(b.monster)}`),
  ].filter(Boolean);
  return `<section class="history-details">${heading}<div class="history-facts">${facts}</div>${xpChips ? `<div class="history-chips">${xpChips}</div>` : ''}${levels ? `<ul class="history-levels">${levels}</ul>` : ''}${habits || harm ? `<ul class="history-habits">${habits}${harm}</ul>` : ''}${extras.length ? `<p class="history-extras">${extras.map(esc).join(' · ')}</p>` : ''}</section>`;
}
function monthSummary(days) {
  const active = days.filter(d => activity(d) > 0).length,
    habits = days.reduce((n, d) => n + d.habits.length, 0),
    tasks = days.reduce((n, d) => n + d.tasks, 0),
    gold = days.reduce((n, d) => n + d.gold, 0),
    wins = days.reduce((n, d) => n + d.battles.filter(b => b.won).length, 0),
    levels = days.reduce((n, d) => n + d.levels.length, 0);
  const xp = Object.fromEntries(E.CATEGORIES.map(c => [c, days.reduce((n, d) => n + d.xp[c], 0)]));
  const most = Math.max(1, ...Object.values(xp));
  const bars = E.CATEGORIES.map(
    c =>
      `<div class="growth-row ${c}"><span>${icon(c)}${E.CATEGORY_META[c].label}</span><div class="growth-bar"><div style="width:${(xp[c] / most) * 100}%"></div></div><strong>+${xp[c]}</strong></div>`,
  ).join('');
  return `<section class="history-month-summary"><div class="history-totals"><span><strong>${active}</strong>active ${active === 1 ? 'day' : 'days'}</span><span><strong>${habits}</strong>habits</span><span><strong>${tasks}</strong>tasks</span><span><strong>${gold}</strong>task gold</span>${wins ? `<span><strong>${wins}</strong>${wins === 1 ? 'victory' : 'victories'}</span>` : ''}${levels ? `<span><strong>${levels}</strong>level ${levels === 1 ? 'up' : 'ups'}</span>` : ''}</div><h4>Stat growth this month</h4>${bars}</section>`;
}
function renderHistory() {
  const current = today(),
    month = app.historyMonth || monthOf(current),
    selected =
      app.historyDay && monthOf(app.historyDay) === month
        ? app.historyDay
        : month === monthOf(current)
          ? current
          : `${month}-01`;
  const days = monthDays(month).map(summary);
  // Monday-first grid; leading blanks align the first day under its weekday.
  const lead = (new Date(`${month}-01T12:00:00Z`).getUTCDay() + 6) % 7;
